<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sports Sim</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='8' fill='%230b0b0b'/%3E%3Cpath d='M9 21l5-6 4 3 5-7' fill='none' stroke='%231baf7a' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f2f1ec;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --border: rgba(11, 11, 11, 0.10);
  --home: #eb6834;
  --accent: #1baf7a;
  --critical: #d03b3b;
  --active: rgba(11, 11, 11, 0.06);
  --nav-w: 224px;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #242422;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --border: rgba(255, 255, 255, 0.10);
    --home: #d95926;
    --accent: #199e70;
    --active: rgba(255, 255, 255, 0.08);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #242422;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --border: rgba(255, 255, 255, 0.10);
  --home: #d95926;
  --accent: #199e70;
  --active: rgba(255, 255, 255, 0.08);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--page);
  color: var(--ink);
  display: grid;
  grid-template-columns: var(--nav-w) 1fr;
  transition: grid-template-columns 0.18s ease;
}
body.collapsed { --nav-w: 64px; }

/* ------------------------------------------------------------------ navigation pane */
.side {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 14px 10px;
  min-width: 0;
  overflow: hidden auto;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  padding: 4px 8px 14px; font-weight: 650; letter-spacing: -0.01em; white-space: nowrap;
}
.brand svg { width: 28px; height: 28px; flex: none; }
.brand small { display: block; font-weight: 450; color: var(--muted); font-size: 12px; }
.sport {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 9px 10px; border: 0; border-radius: 10px; background: transparent;
  color: var(--ink); font: inherit; font-weight: 600; text-align: left; cursor: pointer; white-space: nowrap;
}
.sport { position: relative; transition: background .18s ease; }
.sport:hover { background: var(--active); }
.sport[aria-current="true"] { background: var(--surface-2); }
.sport[aria-current="true"]::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px;
  border-radius: 0 3px 3px 0; background: var(--accent); }
.sport svg { width: 24px; height: 24px; flex: none; }
.sport .label { flex: 1; min-width: 0; }
.sport .label small { display: block; font-weight: 450; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.up { background: var(--accent); }
/* How many legs are in the slip, beside the Parlays tab. */
.count { min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: var(--home); color: #fff;
  font-size: 11px; font-weight: 700; display: inline-grid; place-items: center; flex: none; }
.count[hidden] { display: none; }
/* A page kept behind the menu (the Lab): its button stays in the page, hidden, because the script looks every button up by name. */
.sport[hidden] { display: none !important; }
body.collapsed .sport .count { position: absolute; top: 2px; right: 6px; }
.dot.starting { background: var(--home); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.35; } }
.sections { display: flex; flex-direction: column; margin: 2px 0 8px 34px; padding-left: 8px; border-left: 1px solid var(--border); }
.sections a {
  color: var(--ink-2); text-decoration: none; font-size: 13.5px;
  padding: 5px 10px; border-radius: 8px; white-space: nowrap; transition: background .18s ease, color .18s ease;
}
.sections a:hover { background: var(--active); color: var(--ink); }
.sections a[aria-current="true"] { color: var(--ink); font-weight: 600; }
.spacer { flex: 1; }
.foot { display: flex; align-items: center; gap: 6px; padding: 8px 4px 0; border-top: 1px solid var(--border); }
.iconbtn {
  border: 0; background: transparent; color: var(--ink-2); cursor: pointer;
  width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; flex: none;
}
.iconbtn:hover { background: var(--active); color: var(--ink); }
.iconbtn svg { width: 18px; height: 18px; }
.foot .note { font-size: 12px; color: var(--muted); line-height: 1.3; }
body.collapsed .brand span, body.collapsed .label, body.collapsed .sections,
body.collapsed .foot .note { display: none; }
body.collapsed .sport { justify-content: center; padding: 9px 0; }
body.collapsed .sport .dot { position: relative; margin-left: -12px; margin-top: -18px; }
body.collapsed .brand { justify-content: center; padding-left: 0; padding-right: 0; }
body.collapsed .foot { justify-content: center; }
body.collapsed #collapse svg { transform: scaleX(-1); }

/* ------------------------------------------------------------------ content */
main { position: relative; min-width: 0; min-height: 0; }
iframe {
  position: absolute; inset: 0; width: 100%; height: 100%;
  border: 0; background: var(--page); visibility: hidden; opacity: 0;
  transition: opacity .24s ease, visibility 0s linear .24s;
}
iframe.on { visibility: visible; opacity: 1; transition-delay: 0s; }
.waiting {
  position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 24px;
}
.waiting.on { display: grid; }
.waiting h2 { margin: 14px 0 6px; font-size: 18px; letter-spacing: -0.01em; }
.waiting p { margin: 0; color: var(--ink-2); max-width: 420px; line-height: 1.45; }
.spin {
  width: 34px; height: 34px; margin: 0 auto; border-radius: 50%;
  border: 3px solid var(--border); border-top-color: var(--ink); animation: turn 0.9s linear infinite;
}
@keyframes turn { to { transform: rotate(360deg); } }

/* ------------------------------------------------------------------ phones: a tab bar along the bottom */
@media (max-width: 720px) {
  body, body.collapsed { grid-template-columns: 1fr; grid-template-rows: 1fr auto; grid-template-areas: "main" "nav"; --nav-w: 100%; }
  main { grid-area: main; }
  .side { grid-area: nav; flex-direction: row; align-items: stretch; justify-content: space-around; gap: 2px;
          padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); border-right: 0; border-top: 1px solid var(--border); overflow: hidden; }
  .brand, .sections, .spacer, .foot { display: none; }
  .sport { flex: 1 1 0; width: auto; flex-direction: column; justify-content: center; gap: 3px; padding: 6px 2px;
           font-size: 11.5px; text-align: center; }
  .sport .label { flex: none; }
  .sport .label small, .sport .dot { display: none; }
  .sport svg { width: 24px; height: 24px; }
  .sport[aria-current="true"]::before { left: 25%; right: 25%; top: -6px; bottom: auto; width: auto; height: 3px; border-radius: 0 0 3px 3px; }
  body.collapsed .label { display: block; }
  body.collapsed .sport { justify-content: center; padding: 6px 2px; }
}
@media (prefers-reduced-motion: reduce) {
  body { transition: none; }
  .dot.starting, .spin { animation: none; }
  iframe, .sport, .sections a { transition: none; }
}

/* >>> calm layer: one quiet look for every page. Plain text where there was a pill, a hairline where there was a box, no colour that
   is not data. (Source: sports_dashboard/calm_layer.css; python calm.py writes it at the end of each page's own styles.) */
:root {
  color-scheme: light;
  --page: #fafaf8; --surface: #fafaf8; --surface-2: rgba(24, 24, 22, 0.05);
  --ink: #1b1b19; --ink-2: #53524d; --muted: #8a8983;
  --grid: rgba(24, 24, 22, 0.09); --axis: rgba(24, 24, 22, 0.22);
  --border: rgba(24, 24, 22, 0.10); --border-2: rgba(24, 24, 22, 0.20); --hair: rgba(24, 24, 22, 0.10);
  --shadow: none; --radius: 6px; --radius-sm: 5px;
  --away: #3f6fae; --home: #c4663c; --accent: #1b1b19; --accent-soft: rgba(24, 24, 22, 0.06); --deemph: rgba(24, 24, 22, 0.2);
  --good: #2c7a45; --good-text: #2c7a45; --good-soft: rgba(44, 122, 69, 0.10);
  --bad: #b5453d; --critical: #b5453d; --bad-soft: rgba(181, 69, 61, 0.10);
  --warn: #946310; --warn-soft: rgba(148, 99, 16, 0.12); --info: #3f6fae; --info-soft: rgba(63, 111, 174, 0.12);
  --chip: rgba(24, 24, 22, 0.05); --btn-bg: #1b1b19; --btn-ink: #fafaf8; --active: rgba(24, 24, 22, 0.05);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #131312; --surface: #131312; --surface-2: rgba(255, 255, 255, 0.06);
    --ink: #e8e7e3; --ink-2: #b1b0aa; --muted: #848379;
    --grid: rgba(255, 255, 255, 0.08); --axis: rgba(255, 255, 255, 0.22);
    --border: rgba(255, 255, 255, 0.10); --border-2: rgba(255, 255, 255, 0.20); --hair: rgba(255, 255, 255, 0.10);
    --away: #6b9ddc; --home: #d9805a; --accent: #e8e7e3; --accent-soft: rgba(255, 255, 255, 0.08); --deemph: rgba(255, 255, 255, 0.2);
    --good: #6dbd88; --good-text: #6dbd88; --good-soft: rgba(109, 189, 136, 0.13);
    --bad: #e2837c; --critical: #e2837c; --bad-soft: rgba(226, 131, 124, 0.13);
    --warn: #d8a850; --warn-soft: rgba(216, 168, 80, 0.14); --info: #6b9ddc; --info-soft: rgba(107, 157, 220, 0.14);
    --chip: rgba(255, 255, 255, 0.07); --btn-bg: #e8e7e3; --btn-ink: #131312; --active: rgba(255, 255, 255, 0.07);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #131312; --surface: #131312; --surface-2: rgba(255, 255, 255, 0.06);
  --ink: #e8e7e3; --ink-2: #b1b0aa; --muted: #848379;
  --grid: rgba(255, 255, 255, 0.08); --axis: rgba(255, 255, 255, 0.22);
  --border: rgba(255, 255, 255, 0.10); --border-2: rgba(255, 255, 255, 0.20); --hair: rgba(255, 255, 255, 0.10);
  --away: #6b9ddc; --home: #d9805a; --accent: #e8e7e3; --accent-soft: rgba(255, 255, 255, 0.08); --deemph: rgba(255, 255, 255, 0.2);
  --good: #6dbd88; --good-text: #6dbd88; --good-soft: rgba(109, 189, 136, 0.13);
  --bad: #e2837c; --critical: #e2837c; --bad-soft: rgba(226, 131, 124, 0.13);
  --warn: #d8a850; --warn-soft: rgba(216, 168, 80, 0.14); --info: #6b9ddc; --info-soft: rgba(107, 157, 220, 0.14);
  --chip: rgba(255, 255, 255, 0.07); --btn-bg: #e8e7e3; --btn-ink: #131312; --active: rgba(255, 255, 255, 0.07);
}

/* ---- page and type */
html { scroll-behavior: auto; }
body { background: var(--page); color: var(--ink); font-size: 15px; line-height: 1.5; letter-spacing: 0; text-rendering: auto; }
body::before { display: none; }
h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.25; }
h2 { font-size: 16px; font-weight: 600; letter-spacing: -0.005em; }
h3, .cmp h3 { font-size: 13px; font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--muted); }
.sub, .meta, .lede, .hint, .stamp, .note, .foot, .legend { color: var(--muted); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
main:focus-visible, #view:focus-visible, [tabindex="-1"]:focus-visible { outline: none; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 5px; border: 2px solid var(--page); }
::-webkit-scrollbar-track { background: transparent; }

/* ---- containers: a hairline above, space around, no box */
.card, .hero, section.filters, .list, .bonus-sum, .summary, .tk, .check, .parlay, .qb-line, .sb {
  background: transparent; border: 0; border-radius: 0; box-shadow: none;
}
.card, .tk, .parlay { border-top: 1px solid var(--hair); }
.card { padding: 22px 0 0; }
.hero { border-top: 1px solid var(--hair); padding-top: 4px; }
.hero > div { padding: 18px 22px 18px 0; }
.hero > div + div { border-left: 1px solid var(--hair); padding-left: 22px; }
section.filters { border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); border-radius: 0; padding: 16px 0 18px; }
.list { border-top: 1px solid var(--hair); border-radius: 0; }
.check { border: 1px solid var(--hair); border-radius: 6px; }
.sb { padding: 24px 0 8px; border-top: 1px solid var(--hair); }

/* ---- plain text where there was a pill; an outline where a mark is needed */
.pill, .tag, .badge, span.chip, .flag, .l5, .count-pill {
  background: none; border: 1px solid var(--hair); border-radius: 4px; padding: 0 6px; font-size: 12px; font-weight: 500;
  letter-spacing: 0; text-transform: none; color: var(--ink-2); line-height: 1.65;
}
.page-head .pill, .head .pill, .gc-chips .pill, .card header .pill, .batch-head .pill, .row-between .pill {
  border: 0; padding: 0; color: var(--muted); font-size: 14px; font-weight: 400;
}
.pill.live { background: none; color: var(--muted); }
.pill.live::before { display: none; }
.pill.warn, .tag.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: none; }
.tag.live { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); background: none; }
.tag.upset { color: var(--ink); border-color: var(--ink-2); background: none; }
.chip.good, .l5.hot { color: var(--good-text); background: none; border-color: color-mix(in srgb, var(--good) 45%, transparent); }
.chip.bad, .l5.cold, .flag { color: var(--bad); background: none; border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.chip.warn { color: var(--warn); background: none; border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.chip.info { color: var(--info); background: none; border-color: color-mix(in srgb, var(--info) 45%, transparent); }
.state, .record { background: none; border: 1px solid var(--hair); border-radius: 4px; font-size: 12px; font-weight: 600; letter-spacing: 0; padding: 0 7px; line-height: 1.7; }
.state.won, .record.up { color: var(--good-text); border-color: color-mix(in srgb, var(--good) 45%, transparent); background: none; }
.state.lost, .record.down { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); background: none; }
.pays { background: none; border: 1px solid var(--hair); border-radius: 4px; padding: 0 7px; font-weight: 600; }
.pays.value { color: var(--good-text); border-color: color-mix(in srgb, var(--good) 45%, transparent); background: none; }
.dk { border-radius: 4px; }

/* ---- buttons and fields: square-ish, outlined, no fill */
.btn, button.ghost, button.more, button[data-copy] {
  background: transparent; color: var(--ink); border: 1px solid var(--border-2); border-radius: 5px; padding: 6px 12px; font-weight: 500;
  font-size: 13.5px; box-shadow: none;
}
.btn:hover, button.ghost:hover, button.more:hover, button[data-copy]:hover { background: var(--surface-2); }
details.more { border: 0; background: none; padding: 0; border-radius: 0; box-shadow: none; }
.btn-icon { width: auto; min-width: 34px; padding: 6px 9px; border-radius: 5px; }
.btn-primary, .primary, a.primary { background: var(--btn-bg); color: var(--btn-ink); border: 1px solid var(--btn-bg); border-radius: 5px; box-shadow: none; }
.btn-primary:hover, .primary:hover { opacity: .85; background: var(--btn-bg); }
.select, select, select.select, .input, input.input, .search, input.search, input[type="number"], input[type="text"], input[type="search"], input[type="date"] {
  background-color: transparent; color: var(--ink); border: 1px solid var(--border-2); border-radius: 5px; padding: 6px 10px; font-size: 13.5px; box-shadow: none; height: auto;
}
select.select { height: 34px; padding: 0 30px 0 10px; }
input.input { height: 34px; padding: 0 10px; }
.wf-banner { border-radius: 5px; background: none; border: 1px solid var(--hair); }
.stepper .btn { border-radius: 5px; }
.tooltip { border-radius: 6px; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.28); }
.sk-click { border-radius: 4px; }
.input::placeholder, .search::placeholder, input::placeholder { color: var(--muted); }
.stakebar input { border-radius: 5px; background: transparent; }
.toast { border-radius: 6px; box-shadow: none; }

/* ---- tabs: words with a line under the one you are on */
.nav, .tabs, .pills, .seg {
  display: inline-flex; gap: 22px; padding: 0; background: none; border: 0; border-radius: 0; box-shadow: none; width: auto; max-width: 100%;
}
.nav a, .tabs a, .pills button, .seg button {
  background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 6px 0; margin: 0; box-shadow: none;
  color: var(--muted); font-size: 14px; font-weight: 500; height: auto;
}
.nav a:hover, .tabs a:hover, .pills button:hover, .seg button:hover { color: var(--ink); background: none; }
.nav a[aria-current="page"], .tabs a.on, .pills button[aria-pressed="true"], .seg button[aria-pressed="true"] {
  background: none; color: var(--ink); border-bottom-color: var(--ink); box-shadow: none; font-weight: 600;
}
.seg.small button { padding: 4px 0; font-size: 13px; }
.seg .badge { margin-left: 5px; line-height: 1.3; vertical-align: 1px; }

/* ---- toggles (a leg type, a position, a quick line): a thin outline, filled when on */
button.chip, .chips .chip {
  background: transparent; border: 1px solid var(--hair); border-radius: 5px; padding: 4px 10px; color: var(--ink-2);
  font-size: 13px; font-weight: 500; box-shadow: none;
}
button.chip:hover, .chips .chip:hover { background: var(--surface-2); color: var(--ink); border-color: var(--border-2); }
button.chip[aria-pressed="true"], .chips .chip[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); border-color: var(--border-2); font-weight: 600; }
.chip.small { padding: 2px 8px; font-size: 12.5px; }
button.ghost.on { background: var(--surface-2); color: var(--ink); border-color: var(--ink-2); }
button.switch { border: 0; background: none; border-radius: 0; padding: 4px 0; }
button.switch i { background: var(--border-2); }
button.switch i::after { background: var(--page); }
button.switch[aria-pressed="true"] i { background: var(--ink); }

/* ---- tables */
table { font-size: 14px; }
th { font-size: 12px; font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--hair); }
td { padding: 11px 10px; border-bottom: 1px solid var(--hair); }
tbody tr:hover { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: 0; }
.scroll:not(.chips) { margin: 0; padding: 0; }
table.data th { font-size: 12px; text-transform: none; letter-spacing: 0; font-weight: 500; }

/* ---- figures: a label above, the number under it, no tile */
.kpi .k, .hero .k, .tile-label, .summary .l, .stat-chip span, .check b {
  font-size: 13px; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--muted);
}
.kpi .v, .hero .v, .tile-value, .summary .n, .money .big { font-size: 24px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.2; }
.kpis { gap: 22px 32px; }
.kpi .n, .tile-sub, .hero .s { color: var(--muted); font-size: 13px; }
@media (max-width: 760px) {
  .hero > div { padding: 16px 0; }
  .hero > div + div { border-left: 0; padding-left: 0; border-top: 1px solid var(--hair); }
  .buildbar > .seg { flex: 1 0 100%; }
}
.tile { background: none; border: 0; box-shadow: none; padding: 0; border-radius: 0; }
.statline div { background: none; padding: 0; border-radius: 0; }
.statline span { text-transform: none; letter-spacing: 0; font-size: 12px; }

/* ---- the slate: a game is a block of text with a line above it */
.game-card, a.game-card {
  background: transparent; border: 0; border-top: 1px solid var(--hair); border-radius: 0; box-shadow: none; transform: none;
  padding: 20px 0 22px; gap: 14px;
}
.game-card:hover { transform: none; box-shadow: none; border-color: var(--hair); background: none; }
.game-card:hover .gc-code, .game-card:hover .team-name { text-decoration: underline; text-underline-offset: 3px; }
.game-card.is-final, .game-card.is-started { opacity: 1; }
.game-card.is-final .gc-score { color: var(--muted); }
.gc-top, .gc-top .venue { color: var(--muted); font-size: 13px; }
.gc-code { font-weight: 600; font-size: 16px; letter-spacing: 0; }
.gc-code i, .sb-code i { width: 8px; height: 8px; border-radius: 50%; }
.gc-name { color: var(--muted); font-size: 13px; }
.gc-score, .score-big { font-size: 22px; font-weight: 600; letter-spacing: -0.015em; }
.gc-lines { border-top: 0; padding-top: 2px; font-size: 13.5px; }
.gc-lines .hd { font-size: 12px; font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--muted); }
.gc-lines .lbl { color: var(--muted); }
.gc-chips { gap: 4px 16px; }
.gc-chips .pill { font-size: 13px; }
.gc-props.on::before { background: var(--muted); }
.gc-props::before { opacity: .6; }
.pbar-lbl { font-size: 13px; }
.pbar-lbl .mkt, .pbar-lbl.dim { color: var(--muted); }
.team-row .pct { font-weight: 600; }
.gc-foot { border-top: 1px solid var(--hair); padding-top: 12px; gap: 4px 18px; color: var(--muted); }
.gc-foot .dot::before { content: none; margin: 0; }
.gc-foot .badge { border: 0; padding: 0; font-size: 12.5px; font-weight: 400; color: var(--muted); line-height: inherit; }
.gc-foot .badge.good { color: var(--good-text); }
.gc-foot .badge.bad { color: var(--bad); }

/* ---- bars: thin, flat, one colour a side */
.pbar { height: 4px; gap: 2px; }
.pbar .a, .pbar .h { border-radius: 0; }
.pbar .mk { height: 12px; top: -4px; width: 1.5px; background: var(--ink); opacity: 1; border-radius: 0; }
.pbar i, .winbar span { animation: none; }
.winbar { height: 4px; gap: 2px; }
.winbar span:first-child, .winbar span:last-child { border-radius: 0; }
.winbar.lg { height: 6px; }
.mbar, .usage-bar, .cbar, .rbar, .meter .track, .pick .chance i { border-radius: 0; height: 3px; }
.mbar i, .usage-bar > i, .cbar i, .meter .fill, .pick .chance i::after { border-radius: 0; background: var(--ink); opacity: .45; animation: none; }
.cbar { height: 4px; } .cbar b { height: 12px; top: -4px; border-radius: 0; }
.rbar { height: 4px; } .rbar i { border-radius: 0; }

/* ---- the scoreboard and the comparison under it */
.sb-score { font-size: 38px; font-weight: 600; letter-spacing: -0.02em; }
.sb-code { font-size: 14px; font-weight: 600; letter-spacing: 0; }
.sb-win { font-size: 13.5px; color: var(--muted); }
.sb-mid { color: var(--muted); }
.cmp-h { font-size: 12px; font-weight: 500; text-transform: none; letter-spacing: 0; }
.line-notes { border-top: 1px solid var(--hair); }

/* ---- props: controls without chrome, numbers without badges */
.controls { gap: 14px; }
.chips { gap: 4px 16px; }
.chips.scroll { gap: 4px 22px; }
.chips.scroll .chip, .ctl-row .chips:not(.ladder) .chip {
  background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 5px 0; color: var(--muted); font-size: 14px; font-weight: 500;
}
.chips.scroll .chip:hover, .ctl-row .chips:not(.ladder) .chip:hover { color: var(--ink); background: none; }
.chips.scroll .chip[aria-pressed="true"], .ctl-row .chips:not(.ladder) .chip[aria-pressed="true"] {
  background: none; color: var(--ink); border-bottom-color: var(--ink); font-weight: 600;
}
.ladder { gap: 6px; }
.ctl-label, .field label, .slider-head label { font-size: 12.5px; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--muted); }
.ctl-row.filters { border-top: 1px solid var(--hair); }
.slider-val { font-size: 14px; font-weight: 600; }
.field .slider, .range input[type="range"] { accent-color: var(--ink); }
.gap { background: none; border-radius: 0; padding: 0; min-width: 0; font-weight: 500; color: var(--ink-2); box-shadow: none; }
.gap.soft { background: none; box-shadow: none; color: var(--muted); }
.gap.far { background: none; color: var(--warn); box-shadow: none; font-weight: 600; }
.who b { font-weight: 600; }
.ch b.win { color: var(--ink); }
.ch b { font-size: 14.5px; }
a.dklink:hover { background: none; }
.props-table td { padding-top: 12px; padding-bottom: 12px; }

/* ---- lists and rows */
.pick .chance b { font-size: 18px; font-weight: 600; }
.pick.low .what::after { background: none; border: 0; border-radius: 0; padding: 0; margin-left: 10px; text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 12.5px; vertical-align: baseline; }
.res .mark { width: auto; height: auto; border-radius: 0; background: none; font-size: 14px; font-weight: 600; place-items: start; }
.res.hit .mark { background: none; }
.res.miss .mark { background: none; }
.parlay h2, .tk h4, .tk header h4, .parlay header h2 { text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 500; color: var(--muted); }
#price-out { padding: 18px 0 0 !important; }
.parlay header { padding: 14px 0 0; }
.parlay .sum { padding: 6px 0 14px; }
.parlay .legs { padding: 2px 0 6px; }
.parlay .fine { padding: 0 0 14px; }
.parlay .note { padding: 0 0 6px; }
.parlay .actions { padding: 12px 0 18px; }
.big { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
.row .add { border-radius: 5px; }
.row:hover { background: var(--surface-2); }
.player-row:hover, .qb-line:hover { background-color: var(--surface-2); }

/* ---- the slip stays a panel: it floats over the page */
.slip { background: var(--page); border: 1px solid var(--border-2); border-radius: 8px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.28); }
.sk-sheet, .sk-chip, .sk-panel { box-shadow: 0 6px 24px rgba(0, 0, 0, 0.28); }

/* ---- the hub's navigation: words, no icons, no dots */
.side { background: var(--page); border-right: 1px solid var(--hair); padding: 22px 14px; gap: 2px; }
.side .brand { padding: 0 8px 18px; font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
.side .brand svg, .side .brand small { display: none; }
.side .sport { padding: 6px 8px; border-radius: 5px; font-weight: 600; font-size: 14px; gap: 0; }
.side .sport svg, .side .sport .dot, .side .sport .label small { display: none; }
.side .sport:hover { background: none; }
.side .sport[aria-current="true"] { background: none; }
.side .sport[aria-current="true"]::before { display: none; }
.side .sport[aria-current="true"] .label { border-bottom: 2px solid var(--ink); padding-bottom: 1px; }
.side .sections { margin: 0 0 10px 8px; padding-left: 0; border-left: 0; }
.side .sections a { padding: 4px 8px; border-radius: 4px; font-size: 13.5px; color: var(--muted); }
.side .sections a:hover { background: none; color: var(--ink); }
.side .sections a[aria-current="true"] { color: var(--ink); font-weight: 600; }
.side .foot { border-top: 1px solid var(--hair); }
.side .iconbtn { border-radius: 5px; }
.side .count { border-radius: 4px; background: var(--ink); color: var(--page); margin-left: 6px; }
@media (max-width: 720px) {
  .side { padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); border-right: 0; border-top: 1px solid var(--hair); }
  .side .sport { font-size: 13px; justify-content: center; padding: 10px 2px; text-align: center; }
  .side .sport[aria-current="true"] .label { border-bottom: 2px solid var(--ink); }
}

/* ---- no entrance animations: the page is simply there */
#view > *, .wrap > *, .grid-games > .game-card, .games > .game-card, .results > .parlay, .tickets > *, .skeleton i, .pick .chance i::after { animation: none !important; }
*, *::before, *::after { transition: none !important; }
.skeleton i { background: var(--surface-2); border: 0; border-radius: 0; }
/* <<< calm layer */
</style>
</head>
<body>
  <nav class="side" aria-label="Sports">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="8" fill="var(--ink)"/><path d="M9 21l5-6 4 3 5-7" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Sports Sim<small>simulations and picks</small></span>
    </div>

    <button class="sport" data-app="nfl" aria-current="false" title="NFL">
      <svg viewBox="0 0 32 32" aria-hidden="true"><ellipse cx="16" cy="16" rx="14" ry="9" fill="var(--home)" stroke="var(--ink)" stroke-width="2"/><path d="M11 16h10M13 13v6M17 13v6" stroke="var(--surface)" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span class="label">NFL<small>ratings + simulations</small></span>
      <span class="dot" id="dot-nfl" title="Starting"></span>
    </button>
    <div class="sections" data-app="nfl">
      <a href="#nfl/" data-hash="#/">Slate</a>
      <a href="#nfl/props" data-hash="#/props">Props</a>
      <a href="#nfl/teams" data-hash="#/teams">Teams</a>
      <a href="#nfl/record" data-hash="#/record">Record</a>
      <a href="#injuries/nfl" data-page="injuries" data-hash="#nfl">Injuries</a>
    </div>

    <button class="sport" data-app="mlb" aria-current="false" title="MLB">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/><path d="M9 5.5c3.5 3 3.5 18 0 21M23 5.5c-3.5 3-3.5 18 0 21" fill="none" stroke="#d03b3b" stroke-width="2"/></svg>
      <span class="label">MLB<small>at-bat simulations</small></span>
      <span class="dot" id="dot-mlb" title="Starting"></span>
    </button>
    <div class="sections" data-app="mlb">
      <a href="#mlb/" data-hash="#/">Games</a>
      <a href="#mlb/players" data-hash="players">Players</a>
      <a href="#mlb/record" data-hash="#/record">Record</a>
    </div>

    <button class="sport" data-app="nba" aria-current="false" title="NBA">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="var(--home)" stroke="var(--ink)" stroke-width="2"/><path d="M2 16h28M16 2v28M6 6c6 4 6 16 0 20M26 6c-6 4-6 16 0 20" fill="none" stroke="var(--ink)" stroke-width="1.6"/></svg>
      <span class="label">NBA<small>games and player lines</small></span>
      <span class="dot up" id="dot-nba" title="Ready"></span>
    </button>
    <div class="sections" data-app="nba">
      <a href="#nba/" data-hash="#/">Slate</a>
      <a href="#nba/record" data-hash="#/record">Record</a>
      <a href="#injuries/nba" data-page="injuries" data-hash="#nba">Injuries</a>
    </div>

    <button class="sport" data-app="picks" aria-current="false" title="Picks">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="6" y="4" width="20" height="25" rx="4" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/><path d="M11 12h10M11 17h10M11 22h6" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="label">Picks<small>ready to paste</small></span>
      <span class="dot up" id="dot-picks" title="Ready"></span>
    </button>

    <button class="sport" data-app="injuries" aria-current="false" title="Injuries">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="5" width="22" height="22" rx="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/><path d="M16 10v12M10 16h12" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span class="label">Injuries<small>who is out, and for how long</small></span>
      <span class="dot up" id="dot-injuries" title="Ready"></span>
    </button>

    <button class="sport" data-app="parlays" aria-current="false" title="Parlays">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="9" width="24" height="16" rx="4" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/><path d="M10 9V7h12v2M9 17h4M15 17h8" stroke="var(--home)" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="label">Parlays<small>build, browse, track</small></span>
      <span class="count" id="count-parlays" title="Legs in your slip" hidden></span>
      <span class="dot up" id="dot-parlays" title="Ready"></span>
    </button>

    <button class="sport" data-app="lab" aria-current="false" title="Lab" hidden>
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M13 4v8L6 25a3 3 0 0 0 2.7 4h14.6A3 3 0 0 0 26 25l-7-13V4" fill="var(--surface)" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/><path d="M11 4h10M10 20h12" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="label">Lab<small>what actually works</small></span>
      <span class="dot up" id="dot-lab" title="Ready"></span>
    </button>

    <span class="spacer"></span>
    <div class="foot">
      <button class="iconbtn" id="collapse" aria-label="Collapse the navigation pane" title="Collapse">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5L7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="note" id="note">Both dashboards run while the launcher window is open.</span>
    </div>
  </nav>

  <main>
    <iframe id="frame-lab" title="Lab" allow="clipboard-write; web-share"></iframe>
    <iframe id="frame-nfl" title="NFL dashboard" allow="clipboard-write; web-share"></iframe>
    <iframe id="frame-mlb" title="MLB dashboard" allow="clipboard-write; web-share"></iframe>
    <iframe id="frame-nba" title="NBA" allow="clipboard-write; web-share"></iframe>
    <iframe id="frame-picks" title="Picks" allow="clipboard-write; web-share"></iframe>
    <iframe id="frame-injuries" title="Injuries" allow="clipboard-write; web-share"></iframe>
    <iframe id="frame-parlays" title="Parlay builder" allow="clipboard-write; web-share"></iframe>
    <div class="waiting" id="waiting" role="status" aria-live="polite">
      <div>
        <div class="spin"></div>
        <h2 id="waiting-title">Starting the dashboard</h2>
        <p id="waiting-text">The first start loads a few seasons of stats, which takes up to a minute.</p>
      </div>
    </div>
  </main>

<script>
(() => {
  // On the PC, hub.py answers /status and each sport runs its own server; on the published copy
  // (GitHub Pages) there is no /status, and each sport is a folder beside this page.
  const NAMES = { nfl: 'NFL', mlb: 'MLB', nba: 'NBA', picks: 'Picks', injuries: 'Injuries', parlays: 'Parlays', lab: 'Lab' };
  const PAGES = { nba: 'nba.html?v=20261031120412', picks: 'picks.html?v=20261031120412', injuries: 'injuries.html?v=20261031120412', parlays: 'parlays.html?v=20261031120412', lab: 'lab.html?v=20261031120412' };   // served by this page's own server
  const WAIT_TEXT = {
    nfl: 'Building the power ratings and this week\'s games. The first start downloads play-by-play, which can take a minute.',
    mlb: 'Loading three seasons of player stats and Statcast data. The first start of the day takes up to a minute.',
  };
  const status = { nfl: { up: false, port: null }, mlb: { up: false, port: null }, nba: { up: true }, picks: { up: true },
                   injuries: { up: true }, parlays: { up: true }, lab: { up: true } };
  const loaded = { nfl: false, mlb: false, nba: false, picks: false, injuries: false, parlays: false, lab: false };
  let published = false;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private window */ } },
  };
  let active = null;
  const BEHIND = new Set(['lab']);                  // pages kept behind the menu (their button is hidden): a link or #lab opens them, but the hub never reopens on them

  const today = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  };
  const base = app => {
    if (PAGES[app]) return PAGES[app];
    if (published) return `${app}/?v=20261031120412`;
    return `${location.protocol}//${location.hostname}:${status[app].port}/`;
  };
  const frame = app => document.getElementById(`frame-${app}`);

  function sectionHash(app, raw) {
    if (app === 'mlb' && raw === 'players') return `#/p/${today()}`;
    return raw || '#/';
  }

  function load(app, hash) {
    if (!status[app].up) return;
    const f = frame(app);
    if (PAGES[app]) {
      // A page of our own: a section is a hash, which the page routes on without reloading.
      if (!loaded[app]) { f.src = base(app) + (hash || ''); loaded[app] = true; }
      else if (hash) { try { f.contentWindow.location.hash = hash; } catch (e) { f.src = base(app) + hash; } }
      return;
    }
    const url = base(app) + (hash || '#/');
    if (!loaded[app] || hash) {
      f.src = url;           // for a new hash on the same page the app routes without reloading
      loaded[app] = true;
    }
  }

  function render() {
    for (const app of Object.keys(NAMES)) {
      document.querySelector(`.sport[data-app="${app}"]`).setAttribute('aria-current', String(app === active));
      frame(app).classList.toggle('on', app === active && status[app].up);
      if (PAGES[app]) continue;
      const dot = document.getElementById(`dot-${app}`);
      dot.className = 'dot ' + (status[app].up ? 'up' : 'starting');
      dot.title = published ? (status[app].updated ? `Updated ${status[app].updated}` : 'Published')
                            : (status[app].up ? 'Running' : 'Starting');
    }
    const waiting = !status[active].up;
    document.getElementById('waiting').classList.toggle('on', waiting);
    if (waiting) {
      document.getElementById('waiting-title').textContent = `Starting the ${NAMES[active]} dashboard`;
      document.getElementById('waiting-text').textContent = WAIT_TEXT[active] || '';
    }
    document.title = `${NAMES[active]} · Sports Sim`;
  }

  function show(app, hash) {
    active = app;
    if (!BEHIND.has(app)) store.set('hub.sport', app);
    if (location.hash.split('/')[0] !== `#${app}`) history.replaceState(null, '', `#${app}`);
    load(app, hash);
    render();
  }

  function markSection(link) {
    document.querySelectorAll('.sections a').forEach(a => a.setAttribute('aria-current', String(a === link)));
  }

  document.querySelectorAll('.sport').forEach(btn =>
    btn.addEventListener('click', () => { markSection(null); show(btn.dataset.app); }));
  document.querySelectorAll('.sections a').forEach(a =>
    a.addEventListener('click', e => {
      e.preventDefault();
      const app = a.dataset.page || a.closest('.sections').dataset.app;      // a link under a sport can open a page of its own (Injuries)
      markSection(a);
      show(app, sectionHash(app, a.dataset.hash));
    }));

  const collapseBtn = document.getElementById('collapse');
  const setCollapsed = on => {
    document.body.classList.toggle('collapsed', on);
    collapseBtn.setAttribute('aria-label', on ? 'Expand the navigation pane' : 'Collapse the navigation pane');
    collapseBtn.title = on ? 'Expand' : 'Collapse';
    store.set('hub.collapsed', on ? '1' : '0');
  };
  collapseBtn.addEventListener('click', () => setCollapsed(!document.body.classList.contains('collapsed')));
  setCollapsed(store.get('hub.collapsed') === '1');

  const fmt = iso => new Date(iso).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' });

  async function goPublished() {
    published = true;
    status.nfl = { up: true };
    status.mlb = { up: true };
    const times = [];
    for (const app of ['nfl', 'mlb']) {
      try {
        const m = await (await fetch(`${app}/data/meta.json`, { cache: 'no-cache' })).json();
        status[app].updated = fmt(m.generated);
        times.push(m.generated);
      } catch (e) { /* the page still works without the time */ }
    }
    const newest = times.sort().pop();
    document.getElementById('note').textContent = newest
      ? `Updated ${fmt(newest)}. Simulations run on the PC and publish a few times a day.`
      : 'Simulations run on the PC and publish a few times a day.';
    load(active);
    render();
  }

  async function poll() {
    let allUp = false;
    let r = null;
    try { r = await fetch('status', { cache: 'no-store' }); } catch (e) { r = null; }
    // A server with no /status is the published copy (GitHub Pages, or site/ served locally).
    if (r && r.status === 404 && !published) return goPublished();
    try {
      if (!r || !r.ok) throw new Error('no status');
      const s = await r.json();
      for (const app of ['nfl', 'mlb']) {
        const wasUp = status[app].up;
        status[app] = s[app];
        if (!status[app].up) loaded[app] = false;
        // The sport on screen loads as soon as its dashboard answers; the other waits until it
        // is first opened (each page starts simulating as it loads), then stays loaded.
        if (status[app].up && !wasUp && app === active) load(app);
      }
      allUp = status.nfl.up && status.mlb.up;
    } catch (e) {
      status.nfl.up = status.mlb.up = false;
    }
    if (PAGES[active]) load(active);
    render();
    setTimeout(poll, allUp ? 15000 : 1500);
  }

  // ---------------------------------------------------------------- the slip, shared between pages
  // The Parlays page owns the slip. The dashboards' game pages (NFL, MLB, NBA) ask it for a game's legs and
  // for legs to be put in, and the hub passes the messages between its frames: on the PC the dashboards are
  // other origins and cannot reach the Parlays page any other way. It forwards only what one of its own
  // frames sends, and the Parlays page does the rest.
  let slipState = { sim: 'slip', op: 'state', count: 0, sigs: [] };
  let parlaysReady = false;
  const held = [];                                   // messages for the Parlays page until it has loaded
  const win = app => { const f = frame(app); return f ? f.contentWindow : null; };
  function wakeParlays() {
    const f = frame('parlays');
    if (!f.getAttribute('src')) { f.src = base('parlays'); loaded.parlays = true; }
  }
  function toParlays(msg) {
    if (parlaysReady) win('parlays').postMessage(msg, '*');
    else { held.push(msg); wakeParlays(); }
  }
  function paintCount() {
    const n = slipState.count || 0;
    const badge = document.getElementById('count-parlays');
    badge.hidden = !n;
    badge.textContent = String(n);
  }
  window.addEventListener('message', e => {
    const m = e.data;
    if (!m || m.sim !== 'slip') return;
    const from = Object.keys(NAMES).find(a => win(a) === e.source);
    if (!from) return;
    if (from === 'parlays') {
      if (m.op === 'ready') {
        parlaysReady = true;
        held.splice(0).forEach(x => win('parlays').postMessage(x, '*'));
      } else if (m.op === 'state') {
        slipState = m;
        paintCount();
        for (const a of Object.keys(NAMES)) if (a !== 'parlays' && win(a)) win(a).postMessage(m, '*');
      } else if (m.from && win(m.from)) {
        win(m.from).postMessage(m, '*');             // an answer, back to the page that asked
      }
      return;
    }
    if (m.op === 'open') { show('parlays'); toParlays({ sim: 'slip', op: 'show' }); }
    else if (m.op === 'hello') { e.source.postMessage(slipState, '*'); wakeParlays(); }
    else toParlays({ ...m, from });                  // a request for legs, or a leg to put in
  });

  const fromHash = location.hash.replace(/^#/, '').split('/')[0];
  const last = store.get('hub.sport');
  active = NAMES[fromHash] ? fromHash : (NAMES[last] && !BEHIND.has(last) ? last : 'nfl');
  render();
  poll();
})();
</script>
</body>
</html>
